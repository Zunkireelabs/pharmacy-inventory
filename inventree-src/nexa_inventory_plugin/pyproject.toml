[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inventree-nexa-inventory"
version = "0.1.0"
description = "First-class sale-type dimension for stock movements (B2B credit / B2C cash / B2C online / Gift / Restock / Correction)"
requires-python = ">=3.9"

[project.entry-points.inventree_plugins]
NexaInventoryPlugin = "nexa_inventory.plugin:NexaInventoryPlugin"

[tool.setuptools]
packages = ["nexa_inventory", "nexa_inventory.migrations"]
