name: Deploy to Production

# Manual-only until the placeholders (<NEXA_HOST>, <VPS_PATH>) are replaced and
# the VPS_HOST / VPS_USER / VPS_SSH_KEY secrets exist. Then re-enable:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/zunkireelabs/pharmacy-inventory

jobs:
  build-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./inventree-src
          file: ./inventree-src/Dockerfile.prod
          target: production
          push: true
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:main-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-push
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd <VPS_PATH>
            git fetch --all --prune
            git checkout -B main origin/main
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
            echo "Waiting for container to be healthy..."
            sleep 10
            for i in $(seq 1 27); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' nexa-app-prod 2>/dev/null || echo "unknown")
              if [ "$STATUS" = "healthy" ]; then echo "Healthy!"; exit 0; fi
              echo "Attempt $i/27: $STATUS — waiting 10s..."
              sleep 10
            done
            docker logs nexa-app-prod --tail 50
            exit 1

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify site
        run: |
          for i in $(seq 1 18); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://<NEXA_HOST>/api/system/health/) || CODE=000
            if [ "$CODE" = "200" ]; then echo "OK (HTTP $CODE)"; exit 0; fi
            echo "Attempt $i/18: HTTP $CODE — waiting 10s..."
            sleep 10
          done
          echo "Health check failed"
          exit 1
