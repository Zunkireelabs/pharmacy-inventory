# VPS production deploy — Traefik-fronted, GHCR image, no staging tier.
# Runtime secrets (DB creds, secret key, etc) come from .env.local on the VPS — never committed.

services:
  nexa-app-prod:
    image: ghcr.io/zunkireelabs/pharmacy-inventory:main
    container_name: nexa-app-prod
    restart: unless-stopped
    env_file:
      - .env.local
    volumes:
      - nexa_data:/home/inventree/data
    networks:
      - hosting
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hosting"
      - "traefik.http.routers.nexa-app-prod.rule=Host(`nexa-inventory.zunkireelabs.com`)"
      - "traefik.http.routers.nexa-app-prod.entrypoints=websecure"
      - "traefik.http.routers.nexa-app-prod.tls=true"
      - "traefik.http.routers.nexa-app-prod.tls.certresolver=letsencrypt"
      - "traefik.http.routers.nexa-app-prod-http.rule=Host(`nexa-inventory.zunkireelabs.com`)"
      - "traefik.http.routers.nexa-app-prod-http.entrypoints=web"
      - "traefik.http.routers.nexa-app-prod-http.middlewares=nexa-app-prod-redirect"
      - "traefik.http.middlewares.nexa-app-prod-redirect.redirectscheme.scheme=https"
      - "traefik.http.services.nexa-app-prod.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD-SHELL", "invoke server-health --address \"http://localhost:8000\""]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s

  nexa-worker-prod:
    image: ghcr.io/zunkireelabs/pharmacy-inventory:main
    container_name: nexa-worker-prod
    command: invoke worker
    restart: unless-stopped
    depends_on:
      nexa-app-prod:
        condition: service_healthy
    env_file:
      - .env.local
    volumes:
      - nexa_data:/home/inventree/data
    networks:
      - hosting
    healthcheck:
      test: ["CMD-SHELL", "invoke worker-health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s

networks:
  hosting:
    external: true

volumes:
  nexa_data:
